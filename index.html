<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ÖV &amp; Wetter — Rezeption</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
  /* ======================================================================
   * Helles Layout: weisse Fläche, Hellblau als einzige Akzentfarbe.
   * Bewusst wenige Kästen — getrennt wird über Haarlinien und Weissraum,
   * Hierarchie über Schriftgrösse. Farbe trägt Bedeutung (Verspätung,
   * Niederschlagsart), nicht Dekoration.
   * ==================================================================== */
  :root {
    --bg:         #ffffff;
    --surface:    #f3f8fd;
    --ink:        #0f2739;   /* Haupttext, kein reines Schwarz */
    --ink-2:      #33556f;
    --muted:      #7893a9;
    --line:       #e3edf6;
    --accent:     #1b8ef2;
    --accent-100: #e8f3fe;
    --warn:       #b06a00;
    --warn-100:   #fff3df;
    --alert:      #d22d43;
    --alert-100:  #fdebee;
    /* Niederschlagsarten */
    --p-rain:  #1b8ef2;
    --p-snow:  #5c82a6;
    --p-ice:   #00b09a;
    --p-storm: #7b5cf0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 17px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    cursor: none;                        /* Kiosk: kein Mauszeiger */
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Kopfzeile ---------- */
  header {
    display: flex;
    align-items: center;
    gap: 1.5rem;
    padding: 1.1rem 2rem 0.9rem;
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: baseline; gap: 0.55rem; white-space: nowrap; }
  .brand b { font-size: 1.05rem; font-weight: 700; letter-spacing: -0.01em; }
  .brand span { font-size: 0.82rem; color: var(--muted); }

  /* Normalbetrieb bleibt bewusst unscheinbar, Störungen springen an */
  #global-status {
    flex: 1; text-align: center;
    font-size: 1.05rem; font-weight: 600; color: var(--muted);
    padding: 0.35rem 0.9rem; border-radius: 999px;
    transition: background 0.4s;
  }
  #global-status.warn  { color: var(--warn);  background: var(--warn-100); }
  #global-status.alert { color: var(--alert); background: var(--alert-100); }

  #clock {
    font-size: 2.3rem; font-weight: 300; letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--ink);
  }

  /* ---------- Hauptbereich: zwei Spalten, getrennt durch eine Linie ---------- */
  main {
    flex: 1;
    display: grid;
    grid-template-columns: minmax(0, 1.08fr) minmax(0, 1fr);
    min-height: 0;
  }
  #stops {
    display: flex; flex-direction: column;
    padding: 0.4rem 2rem 0.6rem;
    min-height: 0;
  }
  #right {
    display: flex; flex-direction: column;
    border-left: 1px solid var(--line);
    padding: 1rem 2rem 0.6rem;
    gap: 1rem; min-height: 0;
  }

  /* ---------- Haltestellen: Abschnitte statt Karten ---------- */
  .stop-card {
    flex: 1; display: flex; flex-direction: column;
    padding: 1rem 0 0.3rem; min-height: 0;
    border-top: 1px solid var(--line);
  }
  .stop-card:first-child { border-top: 0; }
  .stop-card.stale { opacity: 0.55; }

  .stop-head { display: flex; align-items: baseline; gap: 0.7rem; margin-bottom: 0.55rem; }
  .stop-head h2 {
    font-size: 1.3rem; font-weight: 650; letter-spacing: -0.015em; color: var(--ink);
  }
  .stop-meta { font-size: 0.76rem; color: var(--muted); }
  .stop-status {
    margin-left: auto; font-size: 0.85rem; font-weight: 600;
    display: flex; align-items: center; gap: 0.42rem;
    padding: 0.16rem 0.6rem; border-radius: 999px;
  }
  .stop-status .dot { width: 0.5rem; height: 0.5rem; border-radius: 50%; }
  .stop-status.ok    { color: var(--muted); }
  .stop-status.ok .dot    { background: #35c17e; }
  .stop-status.warn  { color: var(--warn);  background: var(--warn-100); }
  .stop-status.warn .dot  { background: var(--warn); }
  .stop-status.alert { color: var(--alert); background: var(--alert-100); }
  .stop-status.alert .dot { background: var(--alert); }

  /* ---------- Abfahrtstabelle ---------- */
  table.deps { width: 100%; max-width: 40rem; border-collapse: collapse; font-size: 1.18rem; }
  table.deps td, table.deps th { padding: 0.3rem 0.35rem; white-space: nowrap; vertical-align: middle; }
  table.deps th {
    font-size: 0.68rem; font-weight: 600; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.08em; padding-bottom: 0.25rem;
  }
  th.h-count, th.h-time, th.h-delay { text-align: right; }
  th.h-delay { text-align: left; padding-left: 0.6rem; }

  td.line, th.h-line { width: 3.9rem; }
  .badge {
    display: inline-block; min-width: 3rem; text-align: center;
    padding: 0.14rem 0.45rem; border-radius: 0.35rem;
    background: var(--accent-100); color: var(--accent);
    font-weight: 700; font-size: 1rem; letter-spacing: -0.01em;
  }
  td.dest {
    overflow: hidden; text-overflow: ellipsis; max-width: 0; width: 100%;
    color: var(--ink-2); font-weight: 500;
  }
  td.count, th.h-count {
    text-align: right; width: 4.1rem; font-weight: 700;
    font-variant-numeric: tabular-nums; color: var(--ink);
  }
  td.time, th.h-time {
    text-align: right; width: 4.3rem; font-variant-numeric: tabular-nums;
    color: var(--ink); font-weight: 500;
  }
  td.delay, th.h-delay {
    text-align: left; width: 3.6rem; padding-left: 0.6rem; font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  tr.warn  td.delay { color: var(--warn); }
  tr.alert td.delay, tr.alert td.time, tr.alert td.count { color: var(--alert); }
  tr.alert td.dest { color: var(--alert); }
  tr.alert .badge  { background: var(--alert-100); color: var(--alert); }
  .empty-msg { color: var(--muted); font-size: 0.95rem; padding: 0.5rem 0.2rem; }

  /* ---------- Karte ---------- */
  #map-card { flex: 1; position: relative; min-height: 0; }
  #map {
    position: absolute; inset: 0; border-radius: 0.9rem;
    background: var(--surface); border: 1px solid var(--line);
  }
  /* Nur die Basiskarte entsättigen, nicht die Radarflächen darüber —
     deshalb hängt der Filter am Kachel-Container dieser einen Ebene. */
  .basemap-tint { filter: saturate(0.62) brightness(1.06) contrast(0.94); }

  #radar-label {
    position: absolute; z-index: 1000; top: 0.7rem; right: 0.7rem;
    background: rgba(255,255,255,0.94); border: 1px solid var(--line);
    padding: 0.32rem 0.7rem; border-radius: 0.5rem;
    font-size: 0.82rem; font-variant-numeric: tabular-nums; color: var(--ink-2);
    box-shadow: 0 2px 10px rgba(15,39,57,0.07);
  }
  #radar-label .rl-time { font-weight: 700; color: var(--ink); }
  #radar-label .rl-rel { color: var(--muted); }
  #radar-label .nowcast { color: var(--accent); font-weight: 600; }
  #radar-label .rl-bar {
    display: block; height: 2px; margin-top: 0.4rem;
    background: var(--line); border-radius: 2px; overflow: hidden;
  }
  #radar-label .rl-bar i { display: block; height: 100%; background: var(--accent); }

  /* Regen-Zeitleiste: 15-Minuten-Schritte für die nächsten 2 Stunden.
     Ergänzt das Radar, dessen Prognose bei 30 Minuten endet. */
  #rain-timeline { display: flex; flex-direction: column; gap: 0.32rem; }
  .rt-head { display: flex; align-items: baseline; gap: 0.5rem; }
  .rt-head b {
    font-size: 0.7rem; font-weight: 600; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.09em;
  }
  .rt-head span { margin-left: auto; font-size: 0.72rem; color: var(--muted); }
  .rt-head span.rain { color: var(--accent); font-weight: 700; }
  .rt-bars { display: flex; gap: 2px; height: 0.6rem; }
  .rt-bars i { flex: 1; border-radius: 2px; background: var(--surface); }
  .rt-bars i.r1 { background: #a9d5fb; }
  .rt-bars i.r2 { background: #4aa8f5; }
  .rt-bars i.r3 { background: #0d6fc4; }
  .rt-ticks { display: flex; font-size: 0.66rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .rt-ticks span { flex: 1; }
  .rt-ticks span:last-child { text-align: right; flex: 0 0 auto; }

  /* ---------- Wetter ---------- */
  #weather-card { display: flex; flex-direction: column; padding-top: 0.9rem; border-top: 1px solid var(--line); }
  #weather-head { display: flex; align-items: baseline; gap: 0.7rem; }
  #weather-head h2 {
    font-size: 0.72rem; font-weight: 600; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.09em;
  }
  #weather-head .src { margin-left: auto; font-size: 0.7rem; color: var(--muted); }

  #weather-body { display: flex; align-items: center; gap: 1.3rem; margin-top: 0.5rem; }
  #w-icon { line-height: 0; flex: none; }
  #w-temp {
    font-size: 3.4rem; font-weight: 250; letter-spacing: -0.04em; line-height: 1;
    color: var(--ink); flex: none;
  }
  #w-temp small {
    display: block; font-size: 0.82rem; font-weight: 500; color: var(--muted);
    letter-spacing: 0; margin-top: 0.25rem;
  }
  #w-rain { flex: 1; min-width: 0; }
  #w-rain .headline { font-size: 1.22rem; font-weight: 650; letter-spacing: -0.015em; }
  #w-rain .headline.rain { color: var(--accent); }
  #w-rain .detail { font-size: 0.85rem; color: var(--muted); margin-top: 0.3rem; line-height: 1.45; }

  /* Tagesverlauf: Balkenhöhe = Wahrscheinlichkeit, Farbe = Art */
  #w-hours { display: flex; gap: 0.3rem; align-items: flex-end; margin-top: 0.9rem; }
  .wh {
    flex: 1; min-width: 0; display: flex; flex-direction: column;
    align-items: center; gap: 0.2rem; padding: 0.3rem 0; border-radius: 0.45rem;
  }
  .wh.now { background: var(--accent-100); }
  .wh .h-pct { font-size: 0.68rem; font-variant-numeric: tabular-nums; color: var(--muted); }
  .wh .h-bar {
    width: 100%; max-width: 1.4rem; height: 2.4rem; background: var(--surface);
    border-radius: 0.2rem; display: flex; align-items: flex-end; overflow: hidden;
  }
  .wh .h-bar i { display: block; width: 100%; }
  .wh .h-icon { line-height: 0; }
  .wh .h-temp { font-size: 0.92rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .wh .h-time { font-size: 0.72rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .wh.now .h-time { color: var(--accent); font-weight: 700; }

  .k-rain  { background: var(--p-rain);  }
  .k-snow  { background: var(--p-snow);  }
  .k-ice   { background: var(--p-ice);   }
  .k-storm { background: var(--p-storm); }
  .k-none  { background: var(--p-rain); opacity: 0.22; }
  .wh .h-pct.t-rain  { color: var(--p-rain);  font-weight: 700; }
  .wh .h-pct.t-snow  { color: var(--p-snow);  font-weight: 700; }
  .wh .h-pct.t-ice   { color: var(--p-ice);   font-weight: 700; }
  .wh .h-pct.t-storm { color: var(--p-storm); font-weight: 700; }

  /* Wettersymbole: Wolke neutral, Niederschlag in der Farbe seiner Art */
  .wi { display: block; }
  .wi .i-cloud { fill: #a8bccd; }
  .wi .i-sun { fill: #f6a821; }
  .wi .i-ray, .wi .i-rain, .wi .i-snow, .wi .i-ice, .wi .i-fog {
    fill: none; stroke-width: 1.7; stroke-linecap: round;
  }
  .wi .i-ray  { stroke: #f6a821; }
  .wi .i-rain { stroke: var(--p-rain); }
  .wi .i-snow { stroke: var(--p-snow); }
  .wi .i-ice  { stroke: var(--p-ice); }
  .wi .i-fog  { stroke: #a8bccd; }
  .wi .i-hail { fill: var(--p-storm); }
  .wi .i-bolt { fill: #f6a821; }

  #w-legend { display: flex; gap: 1rem; margin-top: 0.55rem; font-size: 0.7rem; color: var(--muted); }
  #w-legend span { display: flex; align-items: center; gap: 0.32rem; }
  #w-legend i { width: 0.55rem; height: 0.55rem; border-radius: 0.12rem; display: inline-block; }

  /* ---------- Fusszeile ---------- */
  footer {
    display: flex; gap: 1.4rem; align-items: center;
    padding: 0.55rem 2rem; font-size: 0.7rem; color: var(--muted);
    border-top: 1px solid var(--line);
  }
  footer .right { margin-left: auto; }
  #net-warn { color: var(--alert); font-weight: 700; display: none; }

  /* ---------- Diagnose (?debug oder Taste "d") ---------- */
  #diag {
    display: none; position: fixed; z-index: 2000; left: 2rem; bottom: 2.6rem;
    background: #fff; border: 1px solid var(--line); border-radius: 0.7rem;
    padding: 0.8rem 1rem; font-size: 0.82rem; min-width: 23rem;
    box-shadow: 0 10px 32px rgba(15,39,57,0.14);
  }
  #diag b {
    display: block; margin-bottom: 0.5rem; font-size: 0.68rem; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.09em;
  }
  #diag div { display: flex; gap: 0.6rem; padding: 0.16rem 0; }
  #diag span { margin-left: auto; color: var(--muted); }
  #diag .d-ok { color: #1a9c62; }
  #diag .d-fail { color: var(--alert); }
</style>
</head>
<body>

<header>
  <div class="brand"><b>ÖV &amp; Wetter</b><span>Zürich West</span></div>
  <div id="global-status" class="ok">…</div>
  <div id="clock">--:--</div>
</header>

<main>
  <section id="stops"></section>
  <section id="right">
    <div id="map-card">
      <div id="map"></div>
      <div id="radar-label">Radar lädt…</div>
    </div>
    <div id="rain-timeline"></div>
    <div id="weather-card">
      <div id="weather-head">
        <h2>Wetter</h2>
        <span class="src">Source: MeteoSwiss</span>
      </div>
      <div id="weather-body">
        <div id="w-icon"></div>
        <div id="w-temp">–°<small>gefühlt –°</small></div>
        <div id="w-rain">
          <div class="headline">Wetterdaten laden…</div>
          <div class="detail"></div>
        </div>
      </div>
      <div id="w-hours"></div>
      <div id="w-legend"></div>
    </div>
  </section>
</main>

<footer>
  <span>ÖV: transport.opendata.ch</span>
  <span>Wetter: MeteoSwiss ICON via Open-Meteo</span>
  <span id="radar-src">Radar: –</span>
  <span>Karte: © swisstopo</span>
  <span id="net-warn">⚠ Daten veraltet – Netzwerk prüfen</span>
  <span class="right" id="last-update">–</span>
</footer>

<div id="diag"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
"use strict";

/* =========================================================================
 * Konfiguration
 * ========================================================================= */
const CONFIG = {
  // Haltestellen: query wird zur Laufzeit über /v1/locations in eine ID
  // aufgelöst (und in localStorage gecacht). categories filtert optional
  // nach Verkehrsmittel-Kategorie (z.B. nur S-Bahn an der Hardbrücke).
  stops: [
    { key: "fischerweg",  label: "Fischerweg",         query: "Zürich, Fischerweg",         rows: 4 },
    { key: "escherwyss",  label: "Escher-Wyss-Platz",  query: "Zürich, Escher-Wyss-Platz",  rows: 6 },
    { key: "hardbruecke", label: "Hardbrücke (Bahn)",  query: "Zürich Hardbrücke",          rows: 6,
      categories: ["S", "IR", "RE", "IC", "EC"] },
  ],
  // Fester Standort der Rezeption — hier eingetragen, NICHT vom Browser
  // ermittelt. Es wird keine Standortfreigabe angefragt und keine Position
  // gemessen; die Tafel weiss nur, was hier steht. Bestimmt den blauen
  // Punkt auf der Karte, den Kartenausschnitt und den Wetter-Abfrageort.
  home: { lat: 47.393274, lon: 8.513272 },   // Rezeption, Zürich West
  // Zoom 9 zeigt genug Umland, um aufziehenden Regen früh zu sehen.
  // Radarkacheln werden nur bis maxNativeZoom angefragt und darüber
  // hochskaliert — RainViewer liefert sonst "Zoom Level Not Supported".
  mapZoom: 9,
  // Basiskarte von swisstopo. "farbe" = Landeskarte in Farbe (Wald grün,
  // Seen blau), "grau" = neutrale Graustufen, "luftbild" = Satellitenbild.
  // basemapTint entsättigt die Kacheln leicht, damit die Radarflächen
  // darüber nicht mit den Kartenfarben konkurrieren.
  basemap: "farbe",
  basemapTint: true,
  basemaps: {
    farbe:    "ch.swisstopo.pixelkarte-farbe",
    grau:     "ch.swisstopo.pixelkarte-grau",
    luftbild: "ch.swisstopo.swissimage",
  },
  // RainViewer liefert Radarkacheln nur bis Zoomstufe 7 (dokumentiertes
  // Limit des freien Dienstes); darüber kommt ein Platzhalterbild
  // ("Zoom Level Not Supported"). Die Karte zeigt trotzdem Zoom 9 — Leaflet
  // skaliert die Stufe-7-Kacheln hoch, was bei der Auflösung der Radardaten
  // (~1 km) kaum auffällt. Die Liste wird von scharf nach grob geprüft,
  // falls sich das Limit ändert; greift keine Stufe, bleibt das Radar aus.
  radarZoomCandidates: [7, 6, 5],

  // Zeitumfang der Radar-Animation. Für den Rezeptions-Blick zählt, was
  // kommt — nicht was war: nur ein kurzer Anlauf aus der Vergangenheit,
  // dann die Prognose. RainViewer liefert Vergangenheit im 10-Minuten-Takt
  // und bis zu 3 Prognosebilder (rund 30 min voraus, mehr gibt der freie
  // Dienst nicht her).
  radarPastFrames: 2,                    // 10 min davor + aktuelles Bild
  radarNowcast: true,                    // Prognosebilder mitspielen

  refreshOevMs:     60_000,              // Abfahrten
  refreshWeatherMs: 10 * 60_000,         // Wetterzahlen
  refreshRadarMs:   5 * 60_000,          // Radar-Framelisten
  radarFrameMs:     700,                 // Animationstempo je Bild
  radarHoldMs:      2600,                // Standzeit auf dem letzten Prognosebild
  radarOpacity:     0.75,                // Deckkraft der Radarflächen
  staleAfterMs:     5 * 60_000,          // ab wann Daten als veraltet gelten

  delayWarnMin:  2,                      // gelb ab X Minuten Verspätung
  delayAlertMin: 5,                      // rot ab X Minuten

  forecastHours: 12,                     // Stunden im Tagesverlauf-Streifen
  rainRiskPct:   40,                     // ab welcher Wahrscheinlichkeit "Regenrisiko"

  maxLookaheadMin: 90,                   // Abfahrten weiter weg ausblenden
  nightlyReloadHour: 4,                  // täglicher Seiten-Reload (Memory-Hygiene)

  // Wettermodelle in Reihenfolge der Bevorzugung. Open-Meteo führt die
  // MeteoSwiss-Modelle unter "meteoswiss_*"; scheitert eines, wird das
  // nächste probiert. Ohne param = automatische Modellwahl von Open-Meteo.
  weatherModels: [
    { param: "meteoswiss_icon_ch1", label: "MeteoSwiss ICON-CH1" },
    { param: "meteoswiss_icon_ch2", label: "MeteoSwiss ICON-CH2" },
    { param: null,                  label: "Open-Meteo best match" },
  ],

  // Kandidaten für einen MeteoSwiss-Radar-Layer auf wms.geo.admin.ch.
  // Existenz ist nicht bestätigt (Stand Verifikation: nur Messwerte-Layer
  // öffentlich); die Seite probiert sie zur Laufzeit und fällt sonst auf
  // RainViewer zurück. Sobald ein echter Layername bekannt ist: hier
  // an erster Stelle eintragen.
  wmsRadarCandidates: [
    "ch.meteoschweiz.messwerte-niederschlagsradar",
    "ch.meteoschweiz.animation-radar-niederschlag",
  ],
};

/* =========================================================================
 * Hilfsfunktionen
 * ========================================================================= */
const $ = (sel) => document.querySelector(sel);
const fmtTime = (d) => d.toLocaleTimeString("de-CH", { hour: "2-digit", minute: "2-digit" });

async function fetchJson(url) {
  const resp = await fetch(url, { cache: "no-store" });
  if (!resp.ok) throw new Error(`HTTP ${resp.status} für ${url}`);
  return resp.json();
}

/* -------------------------------------------------------------------------
 * Diagnose-Overlay: zeigt pro Datenquelle, ob der Link antwortet.
 * Aufruf mit ?debug in der URL oder Taste "d" — für Inbetriebnahme und
 * Fehlersuche am Kiosk, wo keine Entwicklerkonsole zur Hand ist.
 * ------------------------------------------------------------------------- */
const diag = {
  entries: new Map(),
  visible: new URLSearchParams(location.search).has("debug"),
  set(name, ok, note) {
    this.entries.set(name, { ok, note, at: Date.now() });
    this.render();
  },
  toggle() { this.visible = !this.visible; this.render(); },
  render() {
    const box = $("#diag");
    box.style.display = this.visible ? "block" : "none";
    if (!this.visible) return;
    box.innerHTML = "<b>Datenquellen</b>" + [...this.entries]
      .map(([name, e]) => `<div class="${e.ok ? "d-ok" : "d-fail"}">`
        + `${e.ok ? "✓" : "✗"} ${name}<span>${e.note || ""}</span></div>`)
      .join("");
  },
};
addEventListener("keydown", (e) => { if (e.key === "d") diag.toggle(); });

/* =========================================================================
 * Uhr + Statuszeile
 * ========================================================================= */
function tickClock() {
  $("#clock").textContent = fmtTime(new Date());
}
setInterval(tickClock, 1000);
tickClock();

/* =========================================================================
 * ÖV: Stationboards von transport.opendata.ch
 * ========================================================================= */
const stopState = {};   // key -> { id, journeys, fetchedAt, error }

/** Haltestellen-Query einmalig in eine Stations-ID auflösen (mit Cache). */
async function resolveStationId(stop) {
  const cacheKey = "stationIds.v1";
  const cache = JSON.parse(localStorage.getItem(cacheKey) || "{}");
  if (cache[stop.query]) return cache[stop.query];

  const data = await fetchJson(
    "https://transport.opendata.ch/v1/locations?query=" + encodeURIComponent(stop.query));
  const hit = (data.stations || []).find((s) => s.id);
  if (!hit) throw new Error(`Keine Station gefunden für "${stop.query}"`);
  cache[stop.query] = hit.id;
  localStorage.setItem(cacheKey, JSON.stringify(cache));
  return hit.id;
}

async function fetchStationboard(stop) {
  const st = stopState[stop.key] ?? (stopState[stop.key] = {});
  try {
    st.id = st.id || await resolveStationId(stop);
    const data = await fetchJson(
      `https://transport.opendata.ch/v1/stationboard?id=${st.id}&limit=16`);
    st.journeys = data.stationboard || [];
    st.fetchedAt = Date.now();
    st.error = null;
    diag.set(stop.label, true, `ID ${st.id} · ${st.journeys.length} Abfahrten`);
  } catch (err) {
    st.error = err;
    console.warn("Stationboard-Fehler", stop.key, err);
    diag.set(stop.label, false, err.message);
  }
}

/** Aus einem Journey-Eintrag die Anzeige-Daten ableiten. */
function toDeparture(j) {
  const scheduled = j.stop.departureTimestamp * 1000;
  const delayMin = typeof j.stop.delay === "number" ? j.stop.delay : 0;
  const effective = scheduled + delayMin * 60_000;
  const cat = (j.category || "").trim();
  // Badge: Bahn mit Kategorie ("S9"), Tram/Bus nur Nummer
  const line = ["T", "B", "NFB", "NFT", "TRO"].includes(cat.toUpperCase())
    ? (j.number || cat) : cat + (j.number || "");
  return { line, cat, to: j.to, scheduled, delayMin, effective };
}

function stopSeverity(deps) {
  let maxDelay = 0;
  for (const d of deps) maxDelay = Math.max(maxDelay, d.delayMin);
  if (maxDelay >= CONFIG.delayAlertMin) return { cls: "alert", text: `Störung · bis +${maxDelay}′` };
  if (maxDelay >= CONFIG.delayWarnMin)  return { cls: "warn",  text: `Verspätungen · bis +${maxDelay}′` };
  return { cls: "ok", text: "Normalbetrieb" };
}

function renderStops() {
  const now = Date.now();
  const container = $("#stops");
  container.innerHTML = "";
  let worst = "ok";
  const problems = [];
  let anyStale = false;

  for (const stop of CONFIG.stops) {
    const st = stopState[stop.key] || {};
    const card = document.createElement("div");
    card.className = "stop-card";
    // Höhe nach Zeilenanzahl verteilen statt zu dritteln, sonst klafft
    // unter der kürzesten Haltestelle unnötig Leerraum.
    card.style.flexGrow = String(stop.rows);

    let deps = (st.journeys || []).map(toDeparture)
      .filter((d) => d.effective > now - 30_000)
      .filter((d) => d.effective < now + CONFIG.maxLookaheadMin * 60_000);
    if (stop.categories) deps = deps.filter((d) => stop.categories.includes(d.cat));
    deps.sort((a, b) => a.effective - b.effective);
    deps = deps.slice(0, stop.rows);

    const sev = stopSeverity(deps);
    if (sev.cls === "alert") { worst = "alert"; problems.push(`${stop.label}: Störung`); }
    else if (sev.cls === "warn" && worst !== "alert") { worst = "warn"; problems.push(`${stop.label}: Verspätungen`); }

    const stale = !st.fetchedAt || (now - st.fetchedAt) > CONFIG.staleAfterMs;
    if (stale) { card.classList.add("stale"); anyStale = true; }

    const rows = deps.map((d) => {
      const cls = d.delayMin >= CONFIG.delayAlertMin ? "alert"
                : d.delayMin >= CONFIG.delayWarnMin ? "warn" : "";
      const countMin = Math.max(0, Math.round((d.effective - now) / 60_000));
      const count = countMin === 0 ? "jetzt" : `${countMin}′`;
      const delay = d.delayMin >= CONFIG.delayWarnMin ? `+${d.delayMin}′` : "";
      // "Plan" ist die Fahrplanzeit, die Verspätung steht separat daneben —
      // Plan + Versp. ergibt die tatsächliche Abfahrt, und genau darauf
      // zählt auch "in" herunter. Die drei Spalten passen also zusammen,
      // sobald man die Verspätung dazurechnet.
      return `<tr class="${cls}">
        <td class="line"><span class="badge">${d.line}</span></td>
        <td class="dest">${d.to}</td>
        <td class="count">${count}</td>
        <td class="time">${fmtTime(new Date(d.scheduled))}</td>
        <td class="delay">${delay}</td>
      </tr>`;
    }).join("");

    const head = `<thead><tr>
      <th class="h-line"></th><th></th>
      <th class="h-count">in</th><th class="h-time">Plan</th><th class="h-delay">Versp.</th>
    </tr></thead>`;

    const body = st.error && !st.journeys
      ? `<div class="empty-msg">Daten nicht verfügbar (${st.error.message})</div>`
      : deps.length
        ? `<table class="deps">${head}<tbody>${rows}</tbody></table>`
        : `<div class="empty-msg">Keine Abfahrten in den nächsten ${CONFIG.maxLookaheadMin} min</div>`;

    card.innerHTML = `
      <div class="stop-head">
        <h2>${stop.label}</h2>
        <span class="stop-meta">${st.fetchedAt ? "Stand " + fmtTime(new Date(st.fetchedAt)) : ""}</span>
        <span class="stop-status ${sev.cls}"><span class="dot"></span>${sev.text}</span>
      </div>${body}`;
    container.appendChild(card);
  }

  const gs = $("#global-status");
  gs.className = worst;
  gs.textContent = worst === "ok" ? "ÖV: Alles im Normalbetrieb" : problems.join("  ·  ");

  $("#net-warn").style.display = anyStale ? "inline" : "none";
  $("#last-update").textContent = "Aktualisiert " + fmtTime(new Date());
}

async function refreshOev() {
  await Promise.allSettled(CONFIG.stops.map(fetchStationboard));
  renderStops();
}

/* =========================================================================
 * Wetterzahlen: Open-Meteo (MeteoSwiss-Modell ICON-CH, mit Fallback)
 * ========================================================================= */
/* --- Eigene SVG-Wettersymbole ------------------------------------------
 * Selbst gezeichnet, also keine Lizenz- oder Quellenangabe nötig, und
 * plattformunabhängig: Emoji sehen auf Windows/Linux/Android verschieden
 * aus, diese Symbole überall gleich. Aufbau immer gleich, damit man die
 * Niederschlagsart am Zeichen unter der Wolke erkennt:
 *   Striche = Regen, Sterne = Schnee, Kugeln = Hagel, Blitz = Gewitter.
 * -------------------------------------------------------------------- */
const SVG = {
  cloud: `<g class="i-cloud">
    <circle cx="8.8" cy="12.6" r="3.7"/><circle cx="14.2" cy="11.4" r="4.6"/>
    <circle cx="17.6" cy="14.4" r="2.9"/><rect x="7.6" y="13.4" width="10.6" height="3.9" rx="1.95"/>
  </g>`,
  sunFull: `<circle class="i-sun" cx="12" cy="11.5" r="4.6"/>
    <g class="i-ray"><path d="M12 2.6v2.3M12 18.1v2.3M2.6 11.5h2.3M19.1 11.5h2.3
      M5.4 4.9l1.6 1.6M17 16.5l1.6 1.6M18.6 4.9L17 6.5M7 16.5l-1.6 1.6"/></g>`,
  sunSmall: `<circle class="i-sun" cx="8.6" cy="8.2" r="3.2"/>
    <g class="i-ray"><path d="M8.6 1.9v1.7M2.3 8.2H4M4.2 3.8l1.2 1.2M13 3.8l-1.2 1.2"/></g>`,
  // Anzahl der Striche/Sterne trägt die Intensität: mehr = stärker
  rain: (xs) => `<g class="i-rain">` +
    xs.map((x) => `<path d="M${x} 18.9l-1.5 3.5"/>`).join("") + `</g>`,
  flakes: (xs) => `<g class="i-snow">` + xs.map((x) =>
    `<path d="M${x} 18.7v3.6M${x - 1.6} 19.6l3.2 1.8M${x + 1.6} 19.6l-3.2 1.8"/>`).join("") + `</g>`,
  ice: `<g class="i-ice"><path d="M9.6 18.9l-1.5 3.5"/>
    <path d="M15.4 18.7v3.6M13.8 19.6l3.2 1.8M17 19.6l-3.2 1.8"/></g>`,
  hail: `<g class="i-hail"><circle cx="10" cy="20.8" r="1.6"/><circle cx="15.6" cy="20.8" r="1.6"/></g>`,
  bolt: `<g class="i-bolt" transform="translate(7.6 16.2) scale(0.32)">
    <path d="M13 2L4.09 12.97h6.5L11 22l8.91-10.97h-6.5z"/></g>`,
  fog: `<g class="i-fog"><path d="M4.8 19.4h14.4M7 22h10"/></g>`,
};

/** Symbol-Bausteine je Wetterlage. */
const WEATHER_ICONS = {
  clear:    () => SVG.sunFull,
  partly:   () => SVG.sunSmall + SVG.cloud,
  cloudy:   () => SVG.cloud,
  fog:      () => SVG.cloud + SVG.fog,
  drizzle:  () => SVG.cloud + SVG.rain([10.5, 15]),
  rain:     () => SVG.cloud + SVG.rain([9, 13, 17]),
  rainHeavy:() => SVG.cloud + SVG.rain([7.6, 11, 14.4, 17.8]),
  ice:      () => SVG.cloud + SVG.ice,
  snow:     () => SVG.cloud + SVG.flakes([9.4, 15.4]),
  snowHeavy:() => SVG.cloud + SVG.flakes([7.6, 12.4, 17.2]),
  hail:     () => SVG.cloud + SVG.hail,
  storm:    () => SVG.cloud + SVG.bolt,
  stormHail:() => SVG.cloud + SVG.bolt + SVG.hail,
};

/** WMO-Wettercode -> Symbolname + deutscher Klartext. */
const WMO = {
  0:  ["clear", "klar"],            1:  ["partly", "meist klar"],
  2:  ["partly", "teils bewölkt"],  3:  ["cloudy", "bedeckt"],
  45: ["fog", "Nebel"],             48: ["fog", "Reifnebel"],
  51: ["drizzle", "leichter Niesel"], 53: ["drizzle", "Niesel"], 55: ["rain", "starker Niesel"],
  56: ["ice", "gefrierender Niesel"], 57: ["ice", "gefrierender Niesel"],
  61: ["drizzle", "leichter Regen"], 63: ["rain", "Regen"],  65: ["rainHeavy", "starker Regen"],
  66: ["ice", "gefrierender Regen"], 67: ["ice", "gefrierender Regen"],
  71: ["snow", "leichter Schneefall"], 73: ["snow", "Schneefall"], 75: ["snowHeavy", "starker Schneefall"],
  77: ["snow", "Schneegriesel"],
  80: ["drizzle", "Regenschauer"],  81: ["rain", "Regenschauer"], 82: ["rainHeavy", "heftige Schauer"],
  85: ["snow", "Schneeschauer"],    86: ["snowHeavy", "starker Schneeschauer"],
  95: ["storm", "Gewitter"],
  96: ["stormHail", "Gewitter mit Hagel"], 99: ["stormHail", "Gewitter mit Hagel"],
};

/** Fertiges SVG für einen Wettercode in der gewünschten Kantenlänge. */
function weatherIcon(code, size) {
  const [name] = WMO[code] || ["cloudy"];
  const parts = (WEATHER_ICONS[name] || WEATHER_ICONS.cloudy)();
  return `<svg class="wi" viewBox="0 0 24 24" width="${size}" height="${size}"
    aria-hidden="true">${parts}</svg>`;
}
const wmoText = (code) => (WMO[code] || ["", ""])[1];

async function refreshWeather() {
  const base = "https://api.open-meteo.com/v1/forecast"
    + `?latitude=${CONFIG.home.lat}&longitude=${CONFIG.home.lon}`
    + "&current=temperature_2m,apparent_temperature,precipitation,weather_code"
    + "&minutely_15=precipitation"
    + "&hourly=precipitation_probability,temperature_2m,weather_code"
    // 2 Tage, damit der Stundenstreifen auch abends über Mitternacht reicht
    + "&forecast_days=2&timezone=Europe%2FZurich";
  // Reihenfolge: MeteoSwiss ICON-CH1 (feinstes Modell für die Schweiz),
  // dann ICON-CH2, zuletzt Open-Meteos automatische Modellwahl.
  let data, modelLabel;
  for (const m of CONFIG.weatherModels) {
    try {
      data = await fetchJson(base + (m.param ? "&models=" + m.param : ""));
      modelLabel = m.label;
      break;
    } catch (err) {
      console.warn("Wettermodell nicht verfügbar:", m.param || "(auto)", err.message);
    }
  }
  if (!data) {
    $("#w-rain .headline").textContent = "Wetterdaten nicht verfügbar";
    diag.set("Wetter", false, "kein Modell erreichbar");
    return;
  }
  diag.set("Wetter", true, modelLabel);

  const cur = data.current;
  const text = wmoText(cur.weather_code);
  $("#w-icon").innerHTML = weatherIcon(cur.weather_code, 68);
  $("#w-temp").innerHTML =
    `${Math.round(cur.temperature_2m)}°<small>gefühlt ${Math.round(cur.apparent_temperature)}°</small>`;

  // Nächste 2 h aus 15-Minuten-Raster: regnet es jetzt / wann geht es los?
  const m15 = data.minutely_15 || {};
  const times = m15.time || [];
  const precip = m15.precipitation || [];
  const start = Math.max(times.findIndex((t) => new Date(t).getTime() > Date.now()) - 1, 0);
  let sum2h = 0, firstRainMin = null;
  for (let i = start; i < times.length && i < start + 8; i++) {
    sum2h += precip[i] || 0;
    if (firstRainMin === null && (precip[i] || 0) >= 0.1) {
      firstRainMin = Math.max(0, Math.round((new Date(times[i]).getTime() - Date.now()) / 60_000));
    }
  }

  // Regenwahrscheinlichkeit: Maximum der nächsten 2 Stunden
  const hh = data.hourly || {};
  const hIdx = (hh.time || []).findIndex((t) => new Date(t).getTime() >= Date.now());
  const probs = (hh.precipitation_probability || []).slice(Math.max(hIdx, 0), Math.max(hIdx, 0) + 2)
    .filter((p) => p != null);
  const prob = probs.length ? Math.max(...probs) : null;

  // Erste Stunde mit nennenswertem Regenrisiko im weiteren Tagesverlauf
  const h0 = Math.max(hIdx, 0);
  const hourProbs = hh.precipitation_probability || [];
  let riskAt = null;
  for (let i = h0; i < Math.min(h0 + CONFIG.forecastHours, hourProbs.length); i++) {
    if ((hourProbs[i] || 0) >= CONFIG.rainRiskPct) { riskAt = new Date(hh.time[i]); break; }
  }

  const headEl = $("#w-rain .headline");
  if ((cur.precipitation || 0) >= 0.1) {
    headEl.textContent = `Regnet jetzt (${cur.precipitation.toFixed(1)} mm/h)`;
    headEl.className = "headline rain";
  } else if (firstRainMin !== null && firstRainMin > 0) {
    headEl.textContent = `Regen in ca. ${firstRainMin} min`;
    headEl.className = "headline rain";
  } else if (riskAt) {
    headEl.textContent = `Trocken – Regenrisiko ab ca. ${fmtTime(riskAt)}`;
    headEl.className = "headline";
  } else {
    headEl.textContent = "Trocken – kein Regen in Sicht";
    headEl.className = "headline";
  }
  $("#w-rain .detail").textContent =
    `${text}${prob != null ? ` · Regenwahrscheinlichkeit ${prob} %` : ""}`
    + (sum2h >= 0.1 ? ` · ${sum2h.toFixed(1)} mm in 2 h` : "")
    + ` · Modell ${modelLabel}`;

  renderHourly(hh, h0);
  renderRainTimeline(times, precip, start);
}

/**
 * Zeitleiste für die nächsten 2 Stunden im 15-Minuten-Raster.
 * Das Radar zeigt, WO es regnet, reicht als Prognose aber nur 30 Minuten.
 * Diese Leiste zeigt für den Standort der Rezeption, WANN es regnet —
 * mit der vollen Vorhersagetiefe des MeteoSwiss-Modells.
 */
function renderRainTimeline(times, precip, start) {
  const el = $("#rain-timeline");
  if (!times.length) { el.innerHTML = ""; return; }

  const n = 8;                                  // 8 x 15 min = 2 Stunden
  const cells = [];
  for (let i = start; i < Math.min(start + n, times.length); i++) {
    const mm = precip[i] || 0;
    // Stufen nach Niederschlagsmenge je 15 min
    const cls = mm >= 1 ? "r3" : mm >= 0.3 ? "r2" : mm >= 0.05 ? "r1" : "";
    cells.push({ t: new Date(times[i]), mm, cls });
  }
  if (!cells.length) { el.innerHTML = ""; return; }

  const wet = cells.filter((c) => c.cls);
  const note = wet.length
    ? `Regen ab ${fmtTime(wet[0].t)}`
    : "durchgehend trocken";

  el.innerHTML = `
    <div class="rt-head"><b>Regen an der Rezeption · nächste 2 h</b>
      <span class="${wet.length ? "rain" : ""}">${note}</span></div>
    <div class="rt-bars">${cells.map((c) => `<i class="${c.cls}"></i>`).join("")}</div>
    <div class="rt-ticks">${cells.filter((_, i) => i % 2 === 0)
      .map((c) => `<span>${fmtTime(c.t)}</span>`).join("")}
      <span>${fmtTime(new Date(cells[cells.length - 1].t.getTime() + 15 * 60_000))}</span></div>`;
}

/** Niederschlagsart aus dem WMO-Wettercode — bestimmt die Balkenfarbe. */
function precipKind(code) {
  if (code >= 95) return { key: "storm", label: "Gewitter / Hagel" };
  if ((code >= 71 && code <= 77) || code === 85 || code === 86) return { key: "snow", label: "Schnee" };
  if (code === 56 || code === 57 || code === 66 || code === 67) return { key: "ice", label: "Eisregen" };
  if ((code >= 51 && code <= 65) || (code >= 80 && code <= 82)) return { key: "rain", label: "Regen" };
  return { key: "none", label: null };   // trocken oder nur bewölkt
}

/** Stundenstreifen: Uhrzeit, Symbol, Temperatur, Niederschlagswahrscheinlichkeit. */
function renderHourly(hh, from) {
  const el = $("#w-hours");
  const times = hh.time || [];
  if (!times.length) { el.innerHTML = ""; $("#w-legend").innerHTML = ""; return; }

  const slice = [];
  for (let i = from; i < Math.min(from + CONFIG.forecastHours, times.length); i++) slice.push(i);

  const seen = new Map();   // Arten, die im Zeitfenster tatsächlich vorkommen
  el.innerHTML = slice.map((i, n) => {
    const t = new Date(times[i]);
    const p = hh.precipitation_probability?.[i] ?? 0;
    const temp = hh.temperature_2m?.[i];
    const code = hh.weather_code?.[i];
    const kind = precipKind(code);
    if (kind.label && p >= CONFIG.rainRiskPct) seen.set(kind.key, kind.label);
    // Mindesthöhe 2 %, damit auch 0 % als flacher Balken sichtbar bleibt
    return `<div class="wh${n === 0 ? " now" : ""}">
      <span class="h-pct t-${kind.key}">${p}%</span>
      <span class="h-bar"><i class="k-${kind.key}" style="height:${Math.max(p, 2)}%"></i></span>
      <span class="h-icon">${weatherIcon(code, 26)}</span>
      <span class="h-temp">${temp != null ? Math.round(temp) + "°" : "–"}</span>
      <span class="h-time">${n === 0 ? "jetzt" : fmtTime(t)}</span>
    </div>`;
  }).join("");

  // Legende nur für Arten, die im Zeitfenster wirklich auftreten
  $("#w-legend").innerHTML = seen.size
    ? [...seen].map(([k, label]) => `<span><i class="k-${k}"></i>${label}</span>`).join("")
    : `<span><i class="k-none"></i>kein Niederschlag erwartet</span>`;
}

}).addTo(map);

/** Testet per GetMap-Bild, ob ein WMS-Layer auf wms.geo.admin.ch existiert. */
function probeWmsLayer(layer) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => resolve(true);
    img.onerror = () => resolve(false);   // Fehler-XML statt Bild -> onerror
    img.src = "https://wms.geo.admin.ch/?SERVICE=WMS&VERSION=1.3.0&REQUEST=GetMap"
      + "&FORMAT=image%2Fpng&TRANSPARENT=true&STYLES=&CRS=EPSG%3A3857"
      + "&WIDTH=64&HEIGHT=64&BBOX=940000,6000000,960000,6020000"
      + "&LAYERS=" + encodeURIComponent(layer);
    setTimeout(() => resolve(false), 8000);
  });
}

const radar = { mode: null, frames: [], layers: [], idx: 0, timer: null };

function clearRadarLayers() {
  for (const l of radar.layers) map.removeLayer(l);
  radar.layers = [];
  if (radar.timer) { clearTimeout(radar.timer); radar.timer = null; }
}

/** Bevorzugt: MeteoSwiss-Radar via geo.admin.ch WMS (statisch, aktuellstes Bild). */
async function tryWmsRadar() {
  for (const layer of CONFIG.wmsRadarCandidates) {
    if (await probeWmsLayer(layer)) {
      clearRadarLayers();
      const l = L.tileLayer.wms("https://wms.geo.admin.ch/", {
        layers: layer, format: "image/png", transparent: true, opacity: 0.7,
      }).addTo(map);
      radar.layers = [l];
      radar.mode = "wms";
      $("#radar-label").textContent = "Radar: MeteoSwiss (geo.admin.ch)";
      $("#radar-src").textContent = "Radar: MeteoSwiss via geo.admin.ch";
      diag.set("Radar", true, "WMS " + layer);
      return true;
    }
  }
  return false;
}

/** Kachelkoordinaten (Slippy Map) für eine Position und Zoomstufe. */
function lonLatToTile(lon, lat, z) {
  const n = 2 ** z;
  const r = (lat * Math.PI) / 180;
  return {
    x: Math.floor(((lon + 180) / 360) * n),
    y: Math.floor(((1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2) * n),
  };
}

async function tileByteSize(url) {
  try {
    const resp = await fetch(url, { cache: "no-store" });
    return resp.ok ? (await resp.blob()).size : null;
  } catch { return null; }          // CORS oder Netzfehler -> unbekannt
}

/**
 * Prüft, ob RainViewer auf dieser Zoomstufe echte Radarkacheln liefert.
 * Das Platzhalterbild "Zoom Level Not Supported" ist für jede Kachel
 * byte-identisch und deutlich grösser als eine leere (regenfreie) Kachel.
 * Zwei verschiedene Kacheln gleicher Grösse oberhalb dieser Schwelle sind
 * also der Platzhalter. Rückgabe null = nicht feststellbar.
 */
async function radarZoomUsable(host, path, z) {
  const a = lonLatToTile(CONFIG.home.lon, CONFIG.home.lat, z);
  const url = (x, y) => `${host}${path}/256/${z}/${x}/${y}/2/1_1.png`;
  const [s1, s2] = await Promise.all([
    tileByteSize(url(a.x, a.y)), tileByteSize(url(a.x + 1, a.y + 1)),
  ]);
  if (s1 == null || s2 == null) return null;
  return !(s1 === s2 && s1 > 1500);
}

/** Fallback: RainViewer-Radarkacheln, letzte Stunde + 30 min Nowcast, animiert. */
async function initRainviewerRadar() {
  const cfg = await fetchJson("https://api.rainviewer.com/public/weather-maps.json");
  const past = (cfg.radar.past || []).slice(-CONFIG.radarPastFrames);
  const nowcast = CONFIG.radarNowcast ? (cfg.radar.nowcast || []) : [];
  const frames = [...past, ...nowcast];

  // Höchste Zoomstufe suchen, die echte Kacheln liefert
  let nativeZoom = null, probed = false;
  for (const z of CONFIG.radarZoomCandidates) {
    const ok = await radarZoomUsable(cfg.host, frames[frames.length - 1].path, z);
    if (ok === null) break;                 // nicht messbar -> unten behandelt
    probed = true;
    if (ok) { nativeZoom = z; break; }
  }
  if (nativeZoom === null) {
    clearRadarLayers();
    radar.mode = null;
    if (probed) {
      // Gemessen und keine Stufe brauchbar: lieber nichts zeigen als
      // "Zoom Level Not Supported" über die halbe Karte zu legen.
      $("#radar-label").textContent = "Radar nicht verfügbar";
      $("#radar-src").textContent = "Radar: keine Kacheln verfügbar";
      diag.set("Radar", false, "keine nutzbare Zoomstufe");
      return;
    }
    // Nicht messbar (z.B. kein CORS): dokumentiertes Limit verwenden
    nativeZoom = CONFIG.radarZoomCandidates[0];
  }

  clearRadarLayers();
  radar.mode = "rainviewer";
  radar.frames = frames;
  radar.layers = frames.map((f) =>
    L.tileLayer(`${cfg.host}${f.path}/256/{z}/{x}/{y}/2/1_1.png`,
      { opacity: 0, maxNativeZoom: nativeZoom }).addTo(map));
  radar.idx = 0;

  const lastPastIdx = past.length - 1;
  const step = () => {
    radar.layers.forEach((l, i) => l.setOpacity(i === radar.idx ? CONFIG.radarOpacity : 0));
    const f = radar.frames[radar.idx];
    const t = new Date(f.time * 1000);
    const isNowcast = radar.idx > lastPastIdx;
    // Relative Beschriftung: ohne sie wirkt die Animation wie eine
    // springende Uhr statt wie ein Zeitverlauf.
    const diffMin = Math.round((t.getTime() - Date.now()) / 60_000);
    const rel = isNowcast ? `in ${Math.max(diffMin, 0)} min`
              : diffMin >= -2 ? "jetzt" : `vor ${-diffMin} min`;
    const pct = ((radar.idx + 1) / radar.frames.length) * 100;
    $("#radar-label").innerHTML =
      `<span class="rl-time">${fmtTime(t)}</span> `
      + `<span class="${isNowcast ? "nowcast" : "rl-rel"}">${rel}${isNowcast ? " · Prognose" : ""}</span>`
      + `<span class="rl-bar"><i style="width:${pct}%"></i></span>`;
    // Auf dem letzten (am weitesten vorausschauenden) Bild länger stehen
    // bleiben — das ist die Aussage, die man im Vorbeigehen mitnimmt.
    const isLast = radar.idx === radar.frames.length - 1;
    radar.idx = (radar.idx + 1) % radar.frames.length;
    radar.timer = setTimeout(step, isLast ? CONFIG.radarHoldMs : CONFIG.radarFrameMs);
  };
  step();
  $("#radar-src").textContent = "Radar: RainViewer (Fallback)";
  diag.set("Radar", true,
    `RainViewer · ${past.length} Verlauf + ${nowcast.length} Prognose · Zoom ${nativeZoom}`);
}

async function refreshRadar() {
  try {
    if (radar.mode !== "rainviewer" && await tryWmsRadar()) return;
    await initRainviewerRadar();
  } catch (err) {
    console.warn("Radar-Fehler", err);
    $("#radar-label").textContent = "Radar nicht verfügbar";
    diag.set("Radar", false, err.message);
  }
}

/* =========================================================================
 * Start + Intervalle
 * ========================================================================= */
refreshOev();
refreshWeather();
refreshRadar();
setInterval(refreshOev, CONFIG.refreshOevMs);
setInterval(refreshWeather, CONFIG.refreshWeatherMs);
setInterval(refreshRadar, CONFIG.refreshRadarMs);
// Countdown-Anzeige zwischen den Fetches aktuell halten
setInterval(renderStops, 15_000);
</script>
</body>
</html>
